<svg viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Saksham Gupta - Software Developer and MSc Artificial Intelligence student at NTU Singapore">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10131c"/>
      <stop offset="0.48" stop-color="#151a26"/>
      <stop offset="1" stop-color="#0f1f24"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
      <stop offset="0" stop-color="#6ee7f9"/>
      <stop offset="0.34" stop-color="#a78bfa"/>
      <stop offset="0.68" stop-color="#34d399"/>
      <stop offset="1" stop-color="#6ee7f9"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1200 0; 1200 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="haloGrad" cx="0.5" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#6ee7f9" stop-opacity="0.13"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#10131c" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#6ee7f9" flood-opacity="0.36"/>
    </filter>
    <filter id="nodeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#34d399" flood-opacity="0.55"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0 L0 0 0 42" stroke="#d8e3ff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <style><![CDATA[
      .fadeUp { opacity: 0; animation: fadeUp 0.9s ease-out forwards; }
      .d1 { animation-delay: 0.12s; } .d2 { animation-delay: 0.42s; }
      .d3 { animation-delay: 0.72s; } .d4 { animation-delay: 0.9s; }
      .d5 { animation-delay: 1.08s; } .d6 { animation-delay: 1.26s; }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      .node { animation: pulse 3.1s ease-in-out infinite; }
      .n2 { animation-delay: 0.55s; } .n3 { animation-delay: 1.1s; } .n4 { animation-delay: 1.65s; }
      @keyframes pulse { 0%, 100% { opacity: 0.42; } 50% { opacity: 1; } }
      .flow { stroke-dasharray: 6 10; animation: flow 1.7s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -16; } }
      .tw { animation: twinkle 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .tw2 { animation-delay: 0.9s; } .tw3 { animation-delay: 1.7s; } .tw4 { animation-delay: 2.3s; }
      @keyframes twinkle { 0%, 100% { opacity: 0.18; transform: scale(0.72); } 50% { opacity: 0.95; transform: scale(1.15); } }
      .pt { animation: rise 9s linear infinite; }
      .p2 { animation-delay: 1.5s; } .p3 { animation-delay: 3s; } .p4 { animation-delay: 4.5s; }
      .p5 { animation-delay: 6s; } .p6 { animation-delay: 7.5s; }
      @keyframes rise {
        0% { transform: translateY(0); opacity: 0; }
        12% { opacity: 0.58; }
        84% { opacity: 0.22; }
        100% { transform: translateY(-330px); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .fadeUp, .node, .flow, .tw, .pt { animation: none !important; }
        .fadeUp, .node { opacity: 1 !important; }
        .pt { opacity: 0 !important; }
      }
    ]]></style>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="16" fill="url(#haloGrad)"/>
  <rect x="1" y="1" width="1198" height="298" rx="15" stroke="#2a3346" stroke-width="2"/>

  <g>
    <circle class="pt" cx="322" cy="315" r="2" fill="#6ee7f9"/>
    <circle class="pt p2" cx="458" cy="315" r="1.6" fill="#a78bfa"/>
    <circle class="pt p3" cx="605" cy="315" r="2.1" fill="#34d399"/>
    <circle class="pt p4" cx="744" cy="315" r="1.6" fill="#fbbf24"/>
    <circle class="pt p5" cx="880" cy="315" r="2" fill="#a78bfa"/>
    <circle class="pt p6" cx="532" cy="315" r="1.7" fill="#6ee7f9"/>
  </g>

  <g font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="15">
    <text class="tw" x="310" y="54" fill="#6ee7f9">*</text>
    <text class="tw tw2" x="865" y="43" fill="#a78bfa">*</text>
    <text class="tw tw3" x="910" y="252" fill="#34d399">*</text>
    <text class="tw tw4" x="285" y="262" fill="#fbbf24">*</text>
  </g>

  <g stroke="#6ee7f9" stroke-opacity="0.23" stroke-width="1.5">
    <path d="M58 58 L166 42"/><path d="M58 58 L180 128"/><path d="M42 150 L180 128"/>
    <path d="M80 240 L180 128"/><path d="M80 240 L160 220"/><path d="M166 42 L258 82"/>
    <path d="M180 128 L252 180"/><path d="M160 220 L252 180"/><path d="M258 82 L252 180"/>
  </g>
  <path class="flow" d="M180 128 L258 82" stroke="#34d399" stroke-opacity="0.58" stroke-width="1.5"/>
  <path class="flow" d="M58 58 L180 128" stroke="#6ee7f9" stroke-opacity="0.5" stroke-width="1.5"/>
  <g fill="#6ee7f9" filter="url(#nodeGlow)">
    <circle class="node" cx="58" cy="58" r="5"/><circle class="node n2" cx="42" cy="150" r="4"/>
    <circle class="node n3" cx="80" cy="240" r="5"/><circle class="node n4" cx="166" cy="42" r="4"/>
    <circle class="node n2" cx="180" cy="128" r="6" fill="#a78bfa"/><circle class="node" cx="160" cy="220" r="4"/>
    <circle class="node n3" cx="258" cy="82" r="5" fill="#34d399"/><circle class="node n4" cx="252" cy="180" r="5"/>
  </g>
  <circle cx="58" cy="58" r="3" fill="#34d399">
    <animateMotion dur="3.6s" repeatCount="indefinite" path="M0 0 L122 70 L200 24"/>
  </circle>
  <circle cx="80" cy="240" r="3" fill="#a78bfa">
    <animateMotion dur="4.7s" repeatCount="indefinite" path="M0 0 L100 -112 L172 -60"/>
  </circle>

  <g stroke="#a78bfa" stroke-opacity="0.23" stroke-width="1.5">
    <path d="M1142 58 L1034 42"/><path d="M1142 58 L1020 128"/><path d="M1158 150 L1020 128"/>
    <path d="M1120 240 L1020 128"/><path d="M1120 240 L1040 220"/><path d="M1034 42 L942 82"/>
    <path d="M1020 128 L948 180"/><path d="M1040 220 L948 180"/><path d="M942 82 L948 180"/>
  </g>
  <path class="flow" d="M1020 128 L942 82" stroke="#a78bfa" stroke-opacity="0.58" stroke-width="1.5"/>
  <path class="flow" d="M1142 58 L1020 128" stroke="#34d399" stroke-opacity="0.5" stroke-width="1.5"/>
  <g fill="#a78bfa" filter="url(#nodeGlow)">
    <circle class="node n3" cx="1142" cy="58" r="5"/><circle class="node" cx="1158" cy="150" r="4"/>
    <circle class="node n2" cx="1120" cy="240" r="5"/><circle class="node" cx="1034" cy="42" r="4"/>
    <circle class="node n4" cx="1020" cy="128" r="6" fill="#6ee7f9"/><circle class="node n2" cx="1040" cy="220" r="4"/>
    <circle class="node" cx="942" cy="82" r="5" fill="#34d399"/><circle class="node n3" cx="948" cy="180" r="5"/>
  </g>
  <circle cx="1142" cy="58" r="3" fill="#fbbf24">
    <animateMotion dur="4.2s" repeatCount="indefinite" path="M0 0 L-122 70 L-200 24"/>
  </circle>

  <text class="fadeUp d1" x="600" y="125" text-anchor="middle" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="0" fill="url(#nameGrad)" filter="url(#softGlow)">Saksham Gupta</text>
  <text class="fadeUp d2" x="600" y="176" text-anchor="middle" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#b8c4e6">Software Developer  |  MSc Artificial Intelligence @ NTU Singapore</text>

  <g font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">
    <g class="fadeUp d3">
      <rect x="337" y="212" width="112" height="32" rx="16" fill="#6ee7f9" fill-opacity="0.08" stroke="#6ee7f9" stroke-opacity="0.55"/>
      <text x="393" y="233" text-anchor="middle" fill="#6ee7f9">Agentic AI</text>
    </g>
    <g class="fadeUp d4">
      <rect x="463" y="212" width="76" height="32" rx="16" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.55"/>
      <text x="501" y="233" text-anchor="middle" fill="#a78bfa">RAG</text>
    </g>
    <g class="fadeUp d5">
      <rect x="553" y="212" width="156" height="32" rx="16" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.55"/>
      <text x="631" y="233" text-anchor="middle" fill="#34d399">AI Systems</text>
    </g>
    <g class="fadeUp d6">
      <rect x="723" y="212" width="140" height="32" rx="16" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.55"/>
      <text x="793" y="233" text-anchor="middle" fill="#fbbf24">Hackathons</text>
    </g>
  </g>
</svg>
