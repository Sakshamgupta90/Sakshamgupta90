<svg viewBox="0 0 1200 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Career timeline: MAIT to Curer and Google Summer of Code to NTU Singapore and beyond">
  <defs>
    <linearGradient id="tlGrad" x1="70" y1="0" x2="1130" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6ee7f9"/>
      <stop offset="0.34" stop-color="#34d399"/>
      <stop offset="0.67" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="cometTail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee7f9" stop-opacity="0"/>
      <stop offset="1" stop-color="#6ee7f9" stop-opacity="0.78"/>
    </linearGradient>
    <filter id="cometGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#6ee7f9" flood-opacity="0.82"/>
    </filter>
    <style><![CDATA[
      .ms { opacity: 0; animation: appear 0.6s ease-out forwards; }
      .m1 { animation-delay: 0.3s; } .m2 { animation-delay: 0.7s; }
      .m3 { animation-delay: 1.1s; } .m4 { animation-delay: 1.5s; }
      .m5 { animation-delay: 1.9s; }
      @keyframes appear { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .halo { animation: ripple 2.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      .h2 { animation-delay: 0.5s; } .h3 { animation-delay: 1s; } .h4 { animation-delay: 1.5s; } .h5 { animation-delay: 2s; }
      @keyframes ripple { 0% { transform: scale(1); opacity: 0.68; } 100% { transform: scale(2.4); opacity: 0; } }
      text { font-family: Segoe UI, Ubuntu, Helvetica, Arial, sans-serif; }
      @media (prefers-reduced-motion: reduce) {
        .ms, .halo { animation: none !important; }
        .ms { opacity: 1 !important; }
        .halo { opacity: 0 !important; }
      }
    ]]></style>
  </defs>

  <rect x="1" y="1" width="1198" height="238" rx="14" fill="#10131c" stroke="#2a3346" stroke-width="2"/>
  <line x1="70" y1="120" x2="1130" y2="120" stroke="#263047" stroke-width="4" stroke-linecap="round"/>
  <line x1="70" y1="120" x2="1130" y2="120" stroke="url(#tlGrad)" stroke-width="4" stroke-linecap="round" stroke-dasharray="1060" stroke-dashoffset="1060">
    <animate attributeName="stroke-dashoffset" values="1060;0" dur="2.2s" begin="0.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
  </line>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.6s" fill="freeze"/>
    <g>
      <animateMotion dur="7s" begin="2.6s" repeatCount="indefinite" path="M70 120 L1130 120"/>
      <ellipse cx="-17" cy="0" rx="20" ry="2.4" fill="url(#cometTail)"/>
      <circle cx="0" cy="0" r="4" fill="#6ee7f9" filter="url(#cometGlow)"/>
    </g>
  </g>

  <g class="ms m1">
    <text x="120" y="48" text-anchor="middle" font-size="20" font-weight="800" fill="#d7e3ff">2020</text>
    <text x="120" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#6ee7f9">MAIT</text>
    <text x="120" y="98" text-anchor="middle" font-size="12.5" fill="#7f8aa8">B.Tech - Information Technology</text>
    <line x1="120" y1="104" x2="120" y2="110" stroke="#6ee7f9" stroke-width="2" stroke-opacity="0.5"/>
    <circle class="halo" cx="120" cy="120" r="9" fill="none" stroke="#6ee7f9" stroke-width="2"/>
    <circle cx="120" cy="120" r="9" fill="#6ee7f9"/>
  </g>

  <g class="ms m2">
    <circle class="halo h2" cx="370" cy="120" r="9" fill="none" stroke="#34d399" stroke-width="2"/>
    <circle cx="370" cy="120" r="9" fill="#34d399"/>
    <line x1="370" y1="130" x2="370" y2="136" stroke="#34d399" stroke-width="2" stroke-opacity="0.5"/>
    <text x="370" y="160" text-anchor="middle" font-size="20" font-weight="800" fill="#d7e3ff">2024</text>
    <text x="370" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#34d399">GSoC - IOOS</text>
    <text x="370" y="206" text-anchor="middle" font-size="12.5" fill="#7f8aa8">scientific Python tooling</text>
  </g>

  <g class="ms m3">
    <text x="620" y="48" text-anchor="middle" font-size="20" font-weight="800" fill="#d7e3ff">2024</text>
    <text x="620" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#fbbf24">Curer</text>
    <text x="620" y="98" text-anchor="middle" font-size="12.5" fill="#7f8aa8">Lead Software Developer</text>
    <line x1="620" y1="104" x2="620" y2="110" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.5"/>
    <circle class="halo h3" cx="620" cy="120" r="9" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="620" cy="120" r="9" fill="#fbbf24"/>
  </g>

  <g class="ms m4">
    <circle class="halo h4" cx="870" cy="120" r="9" fill="none" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="870" cy="120" r="9" fill="#a78bfa"/>
    <line x1="870" y1="130" x2="870" y2="136" stroke="#a78bfa" stroke-width="2" stroke-opacity="0.5"/>
    <text x="870" y="160" text-anchor="middle" font-size="20" font-weight="800" fill="#d7e3ff">2026</text>
    <text x="870" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#a78bfa">NTU Singapore</text>
    <text x="870" y="206" text-anchor="middle" font-size="12.5" fill="#7f8aa8">MSc Artificial Intelligence</text>
  </g>

  <g class="ms m5">
    <text x="1105" y="48" text-anchor="middle" font-size="20" font-weight="800" fill="#d7e3ff">2027+</text>
    <text x="1105" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#6ee7f9">What's next</text>
    <text x="1105" y="98" text-anchor="middle" font-size="12.5" fill="#7f8aa8">agentic AI x production systems</text>
    <line x1="1105" y1="104" x2="1105" y2="110" stroke="#6ee7f9" stroke-width="2" stroke-opacity="0.5"/>
    <circle class="halo h5" cx="1105" cy="120" r="9" fill="none" stroke="#6ee7f9" stroke-width="2"/>
    <circle cx="1105" cy="120" r="9" fill="#6ee7f9"/>
  </g>
</svg>
